name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GymShop.slnx

      - name: Build
        run: dotnet build GymShop.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test GymShop.slnx --configuration Release --no-build --verbosity normal
