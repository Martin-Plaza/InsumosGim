name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      GYMSHOP_TEST_SQLSERVER: "Server=localhost,1433;Database=master;User Id=sa;Password=GymShop_CI_Test_2026!;TrustServerCertificate=True"

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: "GymShop_CI_Test_2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'GymShop_CI_Test_2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GymShop.slnx

      - name: Build
        run: dotnet build GymShop.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test GymShop.slnx --configuration Release --no-build --verbosity normal
