services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: GymShopDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${GYMSHOP_DB_PASSWORD}
    volumes:
      - gymshop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d GymShopDb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=GymShopDb;Username=postgres;Password=${GYMSHOP_DB_PASSWORD}
      DatabaseInitialization__Enabled: "true"
      Jwt__Secret: ${GYMSHOP_JWT_SECRET}
      GoogleAuth__ClientId: ${GYMSHOP_GOOGLE_CLIENT_ID:-}
      SeedSuperAdmin__Email: ${GYMSHOP_SEED_ADMIN_EMAIL:-admin@gymshop.com}
      SeedSuperAdmin__Name: ${GYMSHOP_SEED_ADMIN_NAME:-Super Admin}
      SeedSuperAdmin__Password: ${GYMSHOP_SEED_ADMIN_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      PRODUCT_IMAGE_BUCKET: ${PRODUCT_IMAGE_BUCKET:-gymshop-product-images}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  gymshop-postgres-data:
