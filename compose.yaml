services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${GYMSHOP_DB_PASSWORD}
    volumes:
      - gymshop-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=database,1433;Database=GymShopDb;User Id=sa;Password=${GYMSHOP_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Jwt__Secret: ${GYMSHOP_JWT_SECRET}
      GoogleAuth__ClientId: ${GYMSHOP_GOOGLE_CLIENT_ID:-}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  gymshop-sql-data:
